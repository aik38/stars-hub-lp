name: Verify STARS HUB redesign
on:
  push:
    branches: [work/full-site-redesign-20261006]
    paths: ['**/*.html', 'assets/**', 'tools/**', '.github/workflows/verify-redesign.yml']
permissions:
  contents: write
concurrency:
  group: verify-stars-hub-redesign
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved facts and links
        run: |
          python tools/check_site.py
          node --check assets/site.js
          git diff --check
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/stars-hub-qa" playwright@1.62.1
          "$RUNNER_TEMP/stars-hub-qa/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify all pages and viewports
        env:
          PW_MODULE: ${{ runner.temp }}/stars-hub-qa/node_modules/playwright
          SOURCE_SHA: ${{ github.sha }}
        run: node tools/browser_check.cjs
      - name: Save verified screenshots and OGP on the work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/redesign assets/ogp.png
          if ! git diff --cached --quiet; then
            git commit -m 'Record 40 responsive checks and verified STARS HUB brand assets'
            git push origin HEAD:work/full-site-redesign-20261006
          fi
