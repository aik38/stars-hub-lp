name: Verify STARS HUB site
on:
  push:
    branches: [main, work/full-site-completion-20261007]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
      - ".github/workflows/verify-site.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check static page and link integrity
        run: python scripts/verify-static.py
      - name: Check all pages and viewport widths
        run: |
          python -m http.server 8000 > /tmp/stars-hub-server.log 2>&1 &
          node scripts/verify-site.mjs
      - name: Check the published production site
        if: github.ref == 'refs/heads/main'
        env:
          SITE_BASE_URL: https://killerword.info/
          VERIFICATION_OUTPUT: production-verification-output
        run: |
          python scripts/wait-production.py
          node scripts/verify-site.mjs
      - name: Preserve all verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stars-hub-verification
          path: |
            verification-output/
            production-verification-output/
          retention-days: 14
