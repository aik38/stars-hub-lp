<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>全ページ表示検証 STARS HUB</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;font:14px/1.7 system-ui,sans-serif;background:#edf0eb;color:#172b37}h1{font-size:19px;margin:0 0 13px}.tools{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:13px}button,select{font:inherit;padding:8px 14px;background:white;border:1px solid #bac8c2}button{background:#102331;color:white;cursor:pointer}#space{overflow:auto}#stage{transform-origin:top left}iframe{border:0;height:900px;background:white}#result{white-space:pre-wrap;background:white;padding:15px;max-height:600px;overflow:auto;font-size:11px}#status{margin:12px 0}
</style></head><body><h1>STARS HUB 全ページ表示検証</h1><div class="tools"><label>画面幅 <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label>ページ <select id="route"><option value="index.html">トップ</option><option value="contact-center/index.html">予約受付</option><option value="pricing/index.html">料金</option><option value="reputation/index.html">店舗運営支援</option><option value="contact/index.html">お問い合わせ</option><option value="privacy/index.html">プライバシー</option><option value="legal/index.html">運営者情報</option><option value="404.html">404</option></select></label><button id="run">40通りの表示・操作を検証</button><button id="nojs">JavaScriptなし</button></div><p id="status">準備中</p><div id="space"><div id="stage"><iframe id="frame" title="指定画面幅での表示"></iframe></div></div><pre id="result" aria-live="polite">未検証</pre><script>
'use strict';
const widths=[1440,1024,768,390,360];
const routes=['index.html','contact-center/index.html','pricing/index.html','reputation/index.html','contact/index.html','privacy/index.html','legal/index.html','404.html'];
const base=new URL('../',location.href),frame=document.querySelector('#frame'),stage=document.querySelector('#stage'),space=document.querySelector('#space'),width=document.querySelector('#width'),route=document.querySelector('#route'),status=document.querySelector('#status'),output=document.querySelector('#result');
const cache=new Map();let results=[];let current={};
async function source(path){if(!cache.has(path)){const res=await fetch(new URL(path,base));if(!res.ok)throw Error(path+': HTTP '+res.status);cache.set(path,await res.text());}return cache.get(path)}
function size(w){frame.style.width=w+'px';stage.style.width=w+'px';const scale=Math.min(1,(document.body.clientWidth-36)/w);stage.style.transform='scale('+scale+')';space.style.height=(900*scale+4)+'px'}
function settled(){return new Promise(resolve=>{requestAnimationFrame(()=>requestAnimationFrame(resolve))})}
async function show(path=route.value,w=+width.value,nojs=false){size(w);const html=await source(path);const parsed=new DOMParser().parseFromString(html,'text/html');current={path,width:w,sourceGA4:[...parsed.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js?id=G-8S2N18S2YX')).length};
 // Isolate test views from production analytics; the committed tags remain unchanged.
 parsed.querySelectorAll('script').forEach(s=>{if(nojs||s.src.includes('googletagmanager.com')||s.textContent.includes("gtag('config'"))s.remove()});
 const b=parsed.createElement('base');b.href=new URL(path,base).href;parsed.head.prepend(b);
 // Root-relative 404 assets are correct in production; rebase only the preview copy.
 if(path==='404.html')parsed.querySelectorAll('[href],[src]').forEach(e=>{for(const a of ['href','src']){const value=e.getAttribute(a);if(value?.startsWith('/assets/'))e.setAttribute(a,new URL(value.slice(1),base).href)}});
 const done=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.srcdoc='<!doctype html>'+parsed.documentElement.outerHTML;await done;await settled();status.textContent=w+'px / '+path+(nojs?' / JavaScriptなし':'');return inspect()}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow;const visible=e=>e.getClientRects().length>0&&w.getComputedStyle(e).visibility!=='hidden';const nodes=[...d.body.querySelectorAll('*')].filter(e=>visible(e)&&!e.closest('.hero-visual')&&!e.matches('.skip-link'));const outside=nodes.filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.left<-.8||r.right>w.innerWidth+.8)}).map(e=>({tag:e.tagName,class:e.className,text:e.textContent.slice(0,60)}));const clipped=nodes.filter(e=>e.clientWidth>0&&['clip','hidden'].includes(w.getComputedStyle(e).overflowX)&&e.scrollWidth>e.clientWidth+1).map(e=>({tag:e.tagName,class:e.className}));const sticky=d.querySelector('.mobile-cta'),ctaVisible=sticky&&visible(sticky);return {...current,innerWidth:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth+1,outside,clipped,h1:d.querySelectorAll('h1').length,css:d.styleSheets.length,js:d.documentElement.classList.contains('js-ready'),canonical:d.querySelector('link[rel=canonical]')?.href,ogp:d.querySelector('meta[property="og:image"]')?.content,forms:d.querySelectorAll('form').length,prices:[...d.querySelectorAll('.plan-row')].map(e=>e.innerText),mobileCTA:!!ctaVisible,paddingBottom:parseFloat(w.getComputedStyle(d.body).paddingBottom),ctaHeight:ctaVisible?sticky.getBoundingClientRect().height:0,images:[...d.images].map(e=>({src:e.getAttribute('src'),loaded:e.complete&&e.naturalWidth>0}))}}
async function operations(){const d=frame.contentDocument,w=frame.contentWindow;const test={faq:true,menu:true,sticky:true};const details=d.querySelector('details');if(details){details.querySelector('summary').click();test.faq=details.open;details.querySelector('summary').click();test.faq=test.faq&&!details.open}
 if(w.innerWidth<1024){const toggle=d.querySelector('.menu-toggle');toggle.click();test.menu=toggle.getAttribute('aria-expanded')==='true'&&w.getComputedStyle(d.querySelector('#site-nav')).display!=='none';d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));test.menu=test.menu&&toggle.getAttribute('aria-expanded')==='false'}
 if(w.innerWidth<768&&d.querySelector('.mobile-cta')){const a=d.querySelector('main .button-primary');if(a){a.scrollIntoView({block:'center',behavior:'instant'});await settled();test.sticky=d.querySelector('.mobile-cta').hidden}w.scrollTo({top:d.body.scrollHeight,behavior:'instant'});await settled();const result=inspect();test.sticky=test.sticky&&(!result.mobileCTA||result.paddingBottom>=result.ctaHeight)}w.scrollTo({top:0,behavior:'instant'});await settled();return test}
width.addEventListener('change',()=>show().then(r=>output.textContent=JSON.stringify(r,null,2)));route.addEventListener('change',()=>show().then(r=>output.textContent=JSON.stringify(r,null,2)));document.querySelector('#nojs').addEventListener('click',()=>show(route.value,+width.value,true).then(r=>{r.nojsNavigation=frame.contentWindow.getComputedStyle(frame.contentDocument.querySelector('#site-nav')).display!=='none';output.textContent=JSON.stringify(r,null,2)}));
document.querySelector('#run').addEventListener('click',async()=>{const run=document.querySelector('#run');run.disabled=true;results=[];try{for(const w of widths)for(const path of routes){status.textContent='検証中 '+w+'px '+path;let r=await show(path,w);r.operations=await operations();r.pass=!r.overflow&&!r.outside.length&&!r.clipped.length&&r.h1===1&&r.css>0&&r.js&&r.sourceGA4===1&&r.images.every(i=>i.loaded)&&r.canonical?.startsWith('https://killerword.info/')&&Object.values(r.operations).every(Boolean);results.push(r)}const failed=results.filter(r=>!r.pass);window.qaResults={total:results.length,passed:results.length-failed.length,failures:failed,results};output.textContent=JSON.stringify(window.qaResults,null,2);status.textContent='完了 '+window.qaResults.passed+' / '+results.length+' 合格';await show(route.value,+width.value)}catch(e){status.textContent='検証エラー';output.textContent=String(e)}finally{run.disabled=false}});
show().then(r=>output.textContent=JSON.stringify(r,null,2)).catch(e=>output.textContent=String(e));
</script></body></html>
