<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>表示検証 スターズハブ</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;font:16px/1.7 system-ui,sans-serif;background:#F8FAFC;color:#132238}h1{font-size:22px;margin:0 0 14px}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:20px}select,button{font:inherit;padding:8px;border:1px solid #DCE5EF;border-radius:6px;background:white}button{cursor:pointer;background:#1268E8;color:white;padding:9px 18px}button:focus-visible,select:focus-visible{outline:3px solid #1268E8;outline-offset:3px}#stage{margin:auto;width:1440px;transform-origin:top center;position:relative}iframe{border:1px solid #DCE5EF;background:white;height:820px;display:block;margin:auto}#frame-space{width:100%;overflow:auto;height:850px}#result{white-space:pre-wrap;background:white;padding:16px;border:1px solid #DCE5EF;border-radius:8px;font:14px/1.7 ui-monospace,monospace;margin:20px 0}p{margin:12px 0}.status{font-size:14px;color:#536477}
</style></head><body><h1>スターズハブ 表示検証</h1><div class="tools"><label>画面幅 <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select> px</label><label>ページ <select id="page"><option value="">トップ</option><option value="contact-center/">予約受付</option><option value="reputation/">集客支援・評判／リスク対策</option><option value="pricing/">料金</option><option value="contact/">お問い合わせ</option><option value="privacy/">プライバシー</option><option value="legal/">運営者情報</option><option value="404.html">404</option></select></label><button id="all" type="button">全ページ・全幅を検証</button><button id="noscript" type="button">JavaScriptなしを確認</button><button id="robots-check" type="button">robots.txtを確認</button></div><p class="status" id="status">表示準備中</p><div id="frame-space"><div id="stage"><iframe id="preview" title="指定画面幅でのページ表示"></iframe></div></div><pre id="result" aria-live="polite">検証前</pre><script>
'use strict';
const widths=[360,390,768,1024,1440];
const routes=['','contact-center/','reputation/','pricing/','contact/','privacy/','legal/','404.html'];
const base=new URL('../',location.href);const revision=new URLSearchParams(location.search).get('qa')||'20261006-final';function pageURL(path){const url=new URL(path,base);url.searchParams.set('qa',revision);return url.href;}const frame=document.querySelector('#preview');const width=document.querySelector('#width');const page=document.querySelector('#page');const result=document.querySelector('#result');const status=document.querySelector('#status');const stage=document.querySelector('#stage');
function size(w){frame.style.width=(w+2)+'px';stage.style.width=(w+2)+'px';const scale=Math.min(1,(document.body.clientWidth-42)/w);stage.style.transform='scale('+scale+')';stage.style.transformOrigin='top left';document.querySelector('#frame-space').style.height=(820*scale+20)+'px';}
function inspect(){const d=frame.contentDocument;const w=frame.contentWindow;const visible=(e)=>!!e&&w.getComputedStyle(e).display!=='none';const cta=d.querySelector('.mobile-cta');const overflowNodes=[...d.body.querySelectorAll('*')].filter(e=>e instanceof w.HTMLElement&&visible(e)&&e.getBoundingClientRect().width>0).filter(e=>{const r=e.getBoundingClientRect();return r.left<-1||r.right>w.innerWidth+1}).map(e=>({tag:e.tagName,class:e.className,text:e.innerText?.slice(0,70)}));const clippedText=[...d.body.querySelectorAll('*')].filter(e=>e instanceof w.HTMLElement&&visible(e)&&e.clientWidth>0&&['hidden','clip'].includes(w.getComputedStyle(e).overflowX)&&e.scrollWidth>e.clientWidth+1).map(e=>({tag:e.tagName,class:e.className}));return {path:new URL(frame.src).pathname,width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,overflowNodes,clippedText,h1:d.querySelectorAll('h1').length,robots:d.querySelector('meta[name=robots]')?.content??'index, follow',css:d.styleSheets.length,js:d.documentElement.classList.contains('js-ready'),svg:d.querySelectorAll('svg').length,mobileCTA:visible(cta),bodyBottom:parseFloat(w.getComputedStyle(d.body).paddingBottom),ctaHeight:visible(cta)?cta.getBoundingClientRect().height:0,planColumns:d.querySelector('.plans')?w.getComputedStyle(d.querySelector('.plans')).gridTemplateColumns:null,prices:[...d.querySelectorAll('.plan-price')].map(e=>e.innerText),ga4:[...d.scripts].filter(e=>e.src.includes('googletagmanager.com/gtag/js?id=G-8S2N18S2YX')).length,unexpectedScripts:[...d.scripts].filter(e=>e.src&&!e.src.startsWith(base.origin)&&!e.src.includes('googletagmanager.com/gtag/js?id=G-8S2N18S2YX')).length,canonical:d.querySelector('link[rel=canonical]')?.href,ogp:d.querySelector('meta[property="og:image"]')?.content,forms:d.querySelectorAll('form').length};}
function show(){frame.removeAttribute('sandbox');size(+width.value);frame.src=pageURL(page.value);status.textContent=width.value+'px / '+(page.options[page.selectedIndex].textContent);}
frame.addEventListener('load',()=>{try{result.textContent=JSON.stringify(inspect(),null,2);}catch(e){result.textContent=String(e);}});width.addEventListener('change',show);page.addEventListener('change',show);
document.querySelector('#all').addEventListener('click',async()=>{const button=document.querySelector('#all');button.disabled=true;const results=[];const statuses=[];try{for(const r of [...routes,'missing-page-check/','assets/site.css','assets/site.js','assets/favicon.svg','assets/ogp.png','robots.txt','sitemap.xml']){const response=await fetch(new URL(r,base),{cache:'reload'});statuses.push({path:r||'/',status:response.status});}for(const w of widths){size(w);for(const r of routes){status.textContent='検証中: '+w+'px / '+(r||'トップ');await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=pageURL(r);});const item=inspect();item.pass=!item.overflow&&item.h1===1&&item.robots==='index, follow'&&item.css>0&&item.js&&item.ga4===1&&item.unexpectedScripts===0&&item.overflowNodes.length===0&&item.clippedText.length===0&&item.canonical.startsWith('https://killerword.info/')&&item.ogp==='https://killerword.info/assets/ogp.png'&&item.forms===0&&(!item.mobileCTA||item.bodyBottom>=item.ctaHeight);results.push(item);}}const failures=results.filter(x=>!x.pass);result.textContent=JSON.stringify({total:results.length,passed:results.length-failures.length,failures,statuses,results},null,2);status.textContent='検証完了: '+(results.length-failures.length)+' / '+results.length+'件合格';}catch(e){result.textContent=String(e);}finally{button.disabled=false;}});
document.querySelector('#noscript').addEventListener('click',()=>{frame.setAttribute('sandbox','allow-same-origin');size(+width.value);frame.src=pageURL(page.value);status.textContent='JavaScriptなし: '+width.value+'px';});show();
document.querySelector('#robots-check').addEventListener('click',async()=>{const response=await fetch(new URL('robots.txt',base),{cache:'reload'});const text=await response.text();result.textContent=JSON.stringify({status:response.status,text,pass:response.status===200&&!/^Disallow:\s*\/\s*$/m.test(text)&&text.includes('Sitemap: https://killerword.info/sitemap.xml')},null,2);status.textContent='robots.txtの内容を確認';});
</script></body></html>
